<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cue Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Inter:wght@100..900&family=Poppins:wght@400;700&family=Playfair+Display:wght@400..900&family=Roboto+Mono:wght@100..700&family=Caveat:wght@400..700&family=Pacifico&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --ease: cubic-bezier(.22, 1, .36, 1);
    --spring: cubic-bezier(.34, 1.35, .5, 1);
    --glass: rgba(0, 0, 0, .52);
    --glass-border: rgba(0, 0, 0, .4);
    --grid: 40px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    font-family: 'Montserrat', system-ui, sans-serif;
    background-color: #fff;
    background-image: radial-gradient(circle at center, #cdd0da 2px, transparent 2.6px);
    background-size: var(--grid) var(--grid);
    background-position: calc(var(--grid) / -2) calc(var(--grid) / -2);
    overflow: hidden;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  body.placing, body.placing * { cursor: crosshair !important; }
  button { font: inherit; color: inherit; }
  svg { fill: #fff; display: block; }

  /* ---------- world ---------- */
  #world { position: fixed; inset: 0; }
  .item { position: absolute; touch-action: none; animation: itemIn .4s var(--spring) both; }
  .item.out { animation: itemOut .24s ease forwards; pointer-events: none; }
  @keyframes itemIn { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: none; } }
  @keyframes itemOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.88); } }
  .item:not(.text) { cursor: grab; }

  /* audio cue */
  .audio { display: flex; flex-direction: column; gap: 6px; }
  .audio .row { display: flex; gap: 6px; height: 30px; }
  .audio .seek { height: 30px; border-radius: 999px; background: #000; padding: 0 14px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .audio .track { position: relative; flex: 1; height: 3px; border-radius: 3px; background: #4a4a4a; --p: 0%; --b: 0%; }
  .audio .track .buf, .audio .track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .audio .track .buf { width: var(--b); background: #7a7a7a; }
  .audio .track .fill { width: var(--p); background: #fff; }
  .audio .track .knob { position: absolute; top: 50%; left: var(--p); width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
  .audio .play, .audio .restart {
    width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0;
    background: #000; cursor: pointer; flex: none; transition: transform .15s var(--spring);
  }
  .audio .play:active, .audio .restart:active { transform: scale(.9); }
  .audio .play.is-playing svg { transform: scale(.58); }
  .audio .restart svg { width: 100%; height: 100%; transform: scale(.62); }
  .audio .play svg { width: 100%; height: 100%; transform: scale(.6); }
  .audio .pill {
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 13px;
    background: #000; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 500;
    min-width: 90px; max-width: 220px;
  }
  .audio .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; user-select: text; -webkit-user-select: text; }
  .audio .name.unlinked { color: #8a8a8a; }
  .audio .name[contenteditable="true"] { text-overflow: clip; cursor: text; }
  .audio .kebab {
    width: 16px; height: 22px; border: 0; background: none; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 999px;
  }
  .audio .kebab i { width: 3px; height: 3px; border-radius: 50%; background: #fff; }
  .audio .kebab:hover { background: rgba(255,255,255,.14); }

  /* image */
  .image { background: rgba(0,0,0,.04); border-radius: 12px; overflow: hidden; }
  .image img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
  .image .empty {
    width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: #4a4a4a; color: #fff; font-size: 14px; font-weight: 500; border-radius: 12px;
  }
  .image .empty svg { width: 64px; height: 64px; }

  /* text */
  .text .content {
    outline: none; white-space: pre-wrap; word-break: break-word; min-height: 1em; line-height: 1.25;
    cursor: grab; user-select: none; -webkit-user-select: none;
    transition: color .3s ease, font-weight .3s ease, opacity .14s ease;
  }
  .text .content b, .text .content strong { animation: boldIn .3s ease; }
  .text .content i, .text .content em { animation: italicIn .3s ease; }
  @keyframes boldIn { from { font-weight: 400; } to { font-weight: 700; } }
  @keyframes italicIn { from { opacity: .35; } to { opacity: 1; } }
  .text .content[contenteditable="true"] { cursor: text; user-select: text; -webkit-user-select: text; }

  /* ---------- selection frame ---------- */
  .sel { position: fixed; z-index: 50; pointer-events: none; opacity: 0; transform: scale(1.05);
    transition: left .3s var(--ease), top .3s var(--ease), width .3s var(--ease), height .3s var(--ease), opacity .25s, transform .3s var(--ease); }
  .sel.show { opacity: 1; transform: scale(1); }
  .sel.nt { transition: opacity .25s, transform .3s var(--ease); }
  .sel i { position: absolute; width: 12px; height: 12px; border: 0 solid #bdbdbd; }
  .sel .tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 10px; }
  .sel .tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 10px; }
  .sel .bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 10px; }
  .sel .br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 10px; }
  .sel .rh {
    position: absolute; display: none; background: #fff; border: 2px solid #8a8a8a; pointer-events: auto; touch-action: none;
    width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; transition: transform .18s var(--spring), background .2s;
  }
  .sel .rh:hover { transform: scale(1.3); background: #f1f1f1; }
  .sel.resizable .rh { display: block; }
  .sel.is-text .rh[data-h="n"], .sel.is-text .rh[data-h="s"] { display: none; }
  .rh[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; }
  .rh[data-h="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
  .rh[data-h="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
  .rh[data-h="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
  .rh[data-h="n"], .rh[data-h="s"] { left: 50%; width: 24px; height: 9px; margin: -4.5px 0 0 -12px; border-radius: 5px; cursor: ns-resize; }
  .rh[data-h="n"] { top: 0; } .rh[data-h="s"] { top: 100%; }
  .rh[data-h="w"], .rh[data-h="e"] { top: 50%; width: 9px; height: 24px; margin: -12px 0 0 -4.5px; border-radius: 5px; cursor: ew-resize; }
  .rh[data-h="w"] { left: 0; } .rh[data-h="e"] { left: 100%; }
  .ghost i { border-color: #d0d0d0; }

  /* ---------- context bar ---------- */
  .bar {
    position: fixed; z-index: 60; display: flex; align-items: center; padding: 6px;
    background: var(--glass); border: 2px solid var(--glass-border); background-clip: padding-box;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 18px; color: #fff;
    opacity: 0; pointer-events: none; transform: translateY(8px) scale(.96); transform-origin: bottom left;
    transition: opacity .25s ease, transform .4s var(--ease), left .35s var(--ease), top .35s var(--ease);
  }
  .bar.show { opacity: 1; pointer-events: auto; transform: none; }
  .bar button, .bar input {
    height: 34px; border: 0; border-radius: 11px; background: rgba(0,0,0,.35); color: #fff; font-size: 14px; cursor: pointer; padding: 0 10px;
    transition: background .22s ease, color .22s ease, transform .25s var(--spring), opacity .2s;
  }
  .bar button:hover { background: rgba(0,0,0,.6); }
  .bar button:active { transform: scale(.93); }
  .bar .b, .bar .i { width: 34px; padding: 0; margin-right: 4px; }
  .bar .b { font-weight: 700; }
  .bar .i { font-style: italic; font-weight: 600; font-family: Georgia, serif; }
  .bar .b.on, .bar .i.on { background: #fff; color: #000; }
  .bar .fbtn { width: 160px; display: flex; align-items: center; justify-content: space-between; margin-right: 4px; text-align: left; }
  .bar .fbtn span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; }
  .bar .fbtn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ease); }
  .bar .fbtn.open svg { transform: rotate(180deg); }
  .bar .num { position: relative; width: 72px; margin-right: 4px; }
  .bar .num input { width: 100%; margin: 0; padding: 0 24px 0 12px; text-align: left; cursor: text; -moz-appearance: textfield; appearance: textfield; outline: none; }
  .bar .num input::-webkit-outer-spin-button, .bar .num input::-webkit-inner-spin-button, .picker input::-webkit-outer-spin-button, .picker input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .picker input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .bar .step { position: absolute; right: 3px; top: 3px; bottom: 3px; width: 20px; display: flex; flex-direction: column; }
  .bar .step button { flex: 1; width: 100%; height: auto; padding: 0; background: none; border-radius: 7px; display: grid; place-items: center; }
  .bar .step button:hover { background: rgba(255,255,255,.2); }
  .bar .step svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .bar .swatch { width: 34px; padding: 0; display: grid; place-items: center; margin-right: 4px; }
  .bar .swatch i { width: 20px; height: 20px; border-radius: 7px; border: 2px solid rgba(255,255,255,.85); background: var(--c, #111); transition: background .25s ease; }
  .bar .sep { width: 1px; height: 22px; background: rgba(255,255,255,.25); margin: 0 6px 0 2px; flex: none; }
  .bar .danger:hover { background: #b3261e; }
  .bar .txt, .bar .img {
    display: flex; align-items: center; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; pointer-events: none;
    transition: max-width .45s var(--ease), opacity .3s ease;
  }
  .bar.is-text .txt { max-width: 460px; opacity: 1; pointer-events: auto; }
  .bar.is-image .img { max-width: 220px; opacity: 1; pointer-events: auto; }

  /* ---------- popovers: font list + colour picker ---------- */
  .pop {
    position: fixed; z-index: 130; border-radius: 22px; background: rgba(0,0,0,.74); border: 2px solid rgba(0,0,0,.35); background-clip: padding-box;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff;
    opacity: 0; transform: translateY(-8px) scale(.95); transform-origin: top left; pointer-events: none;
    transition: opacity .22s ease, transform .4s var(--ease);
  }
  .pop.show { opacity: 1; transform: none; pointer-events: auto; }
  .fmenu { padding: 8px; width: 230px; overflow: hidden; }
  .flist { max-height: 314px; overflow-y: auto; padding-right: 10px; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior: contain; }
  .flist::-webkit-scrollbar { display: none; }
  .sbar { position: absolute; top: 14px; bottom: 14px; right: 5px; width: 8px; opacity: 0; transition: opacity .3s ease; touch-action: none; }
  .fmenu:hover .sbar, .sbar.on, .sbar.drag { opacity: 1; }
  .sbar i { position: absolute; left: 1px; right: 1px; border-radius: 4px; background: rgba(255,255,255,.4); cursor: grab; transition: background .2s ease, left .2s ease, right .2s ease; }
  .sbar:hover i, .sbar.drag i { background: rgba(255,255,255,.75); left: 0; right: 0; }
  .sbar.drag i { cursor: grabbing; }
  .fmenu button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: #fff; padding: 8px 12px; border-radius: 12px; font-size: 19px; cursor: pointer;
    opacity: 0; transform: translateY(-5px); transition: opacity .2s ease, transform .25s var(--ease), background .2s ease;
  }
  .fmenu.show button { opacity: 1; transform: none; transition-delay: calc(var(--i) * 18ms), calc(var(--i) * 18ms), 0s; }
  .fmenu button:hover { background: rgba(255,255,255,.16); }
  .fmenu button.on { background: rgba(255,255,255,.24); }

  .picker { padding: 16px; width: 254px; }
  .wheel { position: relative; width: 220px; height: 220px; margin: 0 auto; touch-action: none; cursor: crosshair; }
  .wheel .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(hsl(0 100% 50%), hsl(60 100% 50%), hsl(120 100% 50%), hsl(180 100% 50%), hsl(240 100% 50%), hsl(300 100% 50%), hsl(360 100% 50%));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 20px), #000 calc(100% - 19px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 20px), #000 calc(100% - 19px));
  }
  .wheel .sv {
    position: absolute; left: 50px; top: 50px; width: 120px; height: 120px; border-radius: 10px;
    background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, var(--hue, red));
  }
  .wheel i { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.3); pointer-events: none; }
  .wheel #hueH { background: var(--hue, red); }
  .wheel #svH { background: var(--c, #000); }
  .prow { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .prow .eye { width: 34px; height: 34px; border: 0; border-radius: 11px; background: rgba(255,255,255,.14); cursor: pointer; display: grid; place-items: center; padding: 0; transition: background .2s, transform .25s var(--spring); }
  .prow .eye:hover { background: rgba(255,255,255,.25); }
  .prow .eye:active { transform: scale(.92); }
  .prow .eye svg { width: 20px; height: 20px; }
  .prev { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); background: var(--c, #000); transition: background .2s ease; }
  .picker input { height: 34px; border: 0; border-radius: 11px; background: rgba(255,255,255,.14); color: #fff; text-align: center; font: 600 13px 'Montserrat', sans-serif; width: 100%; outline: none; padding: 0 4px; transition: background .2s; }
  .picker input:focus { background: rgba(255,255,255,.26); }
  .picker #hex { flex: 1; text-transform: uppercase; letter-spacing: .04em; }
  .rgb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .rgb label { font-size: 11px; font-weight: 600; opacity: .8; text-align: center; display: block; }
  .rgb input { margin-top: 4px; }
  .swatches { display: flex; gap: 7px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); cursor: pointer; padding: 0; transition: transform .25s var(--spring); }
  .swatches button:hover { transform: scale(1.25); }

  /* ---------- add dock ---------- */
  .dock {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
    width: 40px; height: 40px; border-radius: 20px;
    background: var(--glass); background-clip: padding-box; border: 2px solid var(--glass-border);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    overflow: hidden; cursor: pointer; outline: none;
    transition: width .55s var(--ease), height .75s var(--spring), border-radius .65s var(--ease), transform .2s;
  }
  .dock:not(.open):hover { transform: translateX(-50%) scale(1.08); }
  .dock:not(.open):active { transform: translateX(-50%) scale(.94); }
  .dock:focus-visible { box-shadow: 0 0 0 3px #4c7dff; }
  .dock.open { width: min(calc(100vw - 48px), 1400px); height: 236px; border-radius: 30px; cursor: default; }
  .dock .plus {
    position: absolute; left: 50%; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px;
    transition: opacity .2s, transform .45s var(--ease);
  }
  .dock.open .plus { opacity: 0; transform: rotate(90deg) scale(.4); pointer-events: none; }
  .dock .collapse {
    position: absolute; top: 22px; right: 28px; width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: none; cursor: pointer; display: grid; place-items: center; padding: 0;
    opacity: 0; transform: scale(.4); pointer-events: none; transition: opacity .2s, transform .3s var(--ease), background .15s;
  }
  .dock.open .collapse { opacity: 1; transform: none; pointer-events: auto; transition-delay: .3s, .3s, 0s; }
  .dock .collapse:hover { background: rgba(255,255,255,.15); }
  .dock .collapse svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .cards { position: absolute; left: 30px; top: 16px; display: flex; gap: 14px; opacity: 0; transform: translateY(14px) scale(.97); transform-origin: top left;
    pointer-events: none; transition: opacity .15s, transform .15s; }
  .dock.open .cards { opacity: 1; transform: none; pointer-events: auto; transition: opacity .3s .22s, transform .5s .22s var(--ease); }
  .card {
    width: 200px; height: 200px; border-radius: 22px; border: 3px solid transparent; background: rgba(0,0,0,.4);
    color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 8px;
    transition: border-color .25s, background .25s, transform .25s var(--spring);
  }
  .card:hover, .card:focus-visible { border-color: #fff; background: rgba(0,0,0,.5); outline: none; }
  .card:active { transform: scale(.96); }
  .card svg { width: 92px; height: 92px; margin-bottom: 4px; }
  .card b { font-size: 24px; font-weight: 500; }
  .card small { font-size: 12.5px; font-weight: 400; opacity: .95; }

  /* ---------- save controls ---------- */
  .save { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; gap: 8px; }
  .save button {
    height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid var(--glass-border);
    background: var(--glass); background-clip: padding-box; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); transition: transform .15s var(--spring), background .2s;
  }
  .save button:hover { background: rgba(0,0,0,.68); }
  .save button:active { transform: scale(.94); }

  /* ---------- menu / dialog / toast ---------- */
  .menu {
    position: fixed; z-index: 120; padding: 20px 22px 20px 14px; border-radius: 28px;
    background: rgba(0, 0, 0, .64); background-clip: padding-box; border: 2px solid rgba(0, 0, 0, .25);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); color: #fff;
    opacity: 0; transform: scale(.85) translateX(-14px); transform-origin: left center; pointer-events: none;
    transition: opacity .2s, transform .4s var(--spring);
  }
  .menu.show { opacity: 1; transform: none; pointer-events: auto; }
  .menu button {
    display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; padding: 3px 10px 3px 6px;
    border-radius: 10px; font-size: 17px; font-weight: 500; line-height: 26px; white-space: nowrap; text-align: left; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .menu button svg { width: 22px; height: 22px; flex: none; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .menu button:hover { background: rgba(255,255,255,.14); }
  .menu button:disabled { opacity: .4; cursor: default; pointer-events: none; }
  .menu .danger { color: #ff7b7b; }

  .dialog .lbl { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 0; }
  .dialog .lbl b { float: right; font-weight: 500; color: #666; font-variant-numeric: tabular-nums; }
  .dialog input[type=range] { width: 100%; accent-color: #000; margin: 8px 0 0; }
  .dialog .presets { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .dialog .presets button { height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #eee; font-weight: 600; font-size: 13px; cursor: pointer; transition: background .2s ease, color .2s ease, transform .2s; }
  .dialog .presets button:hover { background: #ddd; }
  .dialog .presets button.on { background: #000; color: #fff; }
  .dialog .chk { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .dialog .chk input { accent-color: #000; width: 16px; height: 16px; }

  .overlay { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: rgba(0,0,0,.25);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .dialog { width: min(520px, calc(100vw - 32px)); background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    transform: translateY(12px) scale(.97); transition: transform .3s var(--ease); user-select: text; -webkit-user-select: text; }
  .overlay.show .dialog { transform: none; }
  .dialog h3 { margin: 0 0 6px; font-size: 18px; }
  .dialog p { margin: 0 0 12px; font-size: 13px; color: #666; line-height: 1.4; }
  .dialog textarea { width: 100%; height: 150px; resize: vertical; border: 2px solid #ddd; border-radius: 12px; padding: 10px; font: 12px/1.4 ui-monospace, monospace; outline: none; }
  .dialog textarea:focus { border-color: #000; }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .dialog .row button { height: 40px; padding: 0 18px; border-radius: 20px; border: 0; cursor: pointer; font-weight: 600; background: #eee; }
  .dialog .row .go { background: #000; color: #fff; }

  .toast { position: fixed; left: 50%; bottom: 28px; z-index: 300; transform: translate(-50%, 20px); padding: 10px 18px; border-radius: 20px;
    background: #000; color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="world"></div>

<div class="sel ghost" id="ghost"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="sel" id="sel"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><b class="rh" data-h="nw"></b><b class="rh" data-h="n"></b><b class="rh" data-h="ne"></b><b class="rh" data-h="e"></b><b class="rh" data-h="se"></b><b class="rh" data-h="s"></b><b class="rh" data-h="sw"></b><b class="rh" data-h="w"></b></div>

<div class="bar" id="bar">
  <div class="txt">

    <button class="i" data-cmd="italic" title="Italic">I</button>

        <button data-d="-1" aria-label="Smaller" tabindex="-1"><svg viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg></button>
      </div></div>
    <button class="swatch" id="colorBtn" title="Colour"><i></i></button>
    <span class="sep"></span>
  </div>
  <div class="img"><button id="replace">Replace image</button><span class="sep"></span></div>
  <button class="danger" id="del" title="Delete (Del)">Delete</button>
</div>

<div class="pop fmenu" id="fmenu"><div class="flist" id="flist"></div><div class="sbar" id="sbar"><i></i></div></div>

<div class="pop picker" id="picker">
  <div class="wheel" id="wheel">
    <div class="ring"></div><div class="sv"></div><i id="hueH"></i><i id="svH"></i>
  </div>
  <div class="prow">
    <button class="eye" id="eye" title="Pick colour from screen"><svg viewBox="0 0 24 24"><path d="M20.7 5.3a2.4 2.4 0 0 0-3.4 0l-2.6 2.6-.7-.7-1.4 1.4.7.7-7.2 7.2c-.2.2-.3.4-.3.7v2.4h2.4c.3 0 .5-.1.7-.3l7.2-7.2.7.7 1.4-1.4-.7-.7 2.6-2.6a2.4 2.4 0 0 0 0-3.4zM8.7 17.6H7v-1.7l7.2-7.2 1.7 1.7-7.2 7.2z"/></svg></button>
    <div class="prev"></div>
    <input id="hex" maxlength="7" spellcheck="false" autocomplete="off">
  </div>
  <div class="rgb">
    <label>R<input type="number" id="cr" min="0" max="255"></label>
    <label>G<input type="number" id="cg" min="0" max="255"></label>
    <label>B<input type="number" id="cb" min="0" max="255"></label>
  </div>
  <div class="swatches" id="swatches"></div>
</div>

<div class="dock" id="dock" role="button" tabindex="0" aria-label="Add element" aria-expanded="false">
  <svg class="plus" viewBox="0 0 24 24"><path d="M11,13H6q-0.42,0-0.71-0.29Q5,12.43 5,12t0.29-0.71T6,11h5V6q0-0.43 0.29-0.71T12,5t0.71,0.29T13,6v5h5q0.43,0 0.71,0.29T19,12t-0.29,0.71T18,13H13v5q0,0.43-0.29,0.71T12,19t-0.71-0.29Q11,18.43 11,18V13Z"/></svg>

  <div class="cards">
    <button class="card" data-type="audio"><span data-icon="audio"></span><b>Audio</b><small>Make audio cue controls</small></button>
    <button class="card" data-type="image"><span data-icon="image"></span><b>Images</b><small>Add images or videos</small></button>
    <button class="card" data-type="text"><span data-icon="text"></span><b>Text</b><small>Add texts and notes</small></button>
  </div>
</div>

<div class="save">
  <button id="copy">Copy save</button>
  <button id="paste">Paste save</button>
</div>

<div class="menu" id="menu"></div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h3>Paste a save</h3>
    <p>Paste the text you copied with “Copy save”. This replaces everything on the board right now.</p>
    <textarea id="pasteBox" placeholder="Paste here…" spellcheck="false"></textarea>
    <div class="row"><button id="pasteCancel">Cancel</button><button class="go" id="pasteGo">Load</button></div>
  </div>
</div>

<div class="overlay" id="lenOverlay">
  <div class="dialog">
    <h3>Edit length</h3>

    <label class="lbl">Start <b id="lenS"></b><input type="range" id="lenStart" min="0" step="0.01" value="0"></label>
    <label class="lbl">End <b id="lenE"></b><input type="range" id="lenEnd" min="0" step="0.01" value="0"></label>
    <label class="chk"><input type="checkbox" id="lenLoop"> Loop</label>
    <div class="row"><button id="lenPreview">Preview</button><button class="go" id="lenDone">Done</button></div>
  </div>
</div>

<div class="overlay" id="spdOverlay">
  <div class="dialog">
    <h3>Playback speed</h3>
    <p>How fast this cue plays. 1× is the original speed.</p>
    <label class="lbl">Speed <b id="spdV">1.00×</b><input type="range" id="spd" min="0.25" max="3" step="0.05" value="1"></label>
    <div class="presets" id="spdPresets"></div>
    <label class="chk"><input type="checkbox" id="spdPitch" checked> Keep original pitch</label>
    <div class="row"><button id="spdPreview">Preview</button><button class="go" id="spdDone">Done</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileAudio" accept="audio/*" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>

<script>
(() => {
  /* ---------- icons ---------- */
  const ICON = {
    image: '<svg viewBox="0 0 24 24"><path d="M5.8,19.7q-0.65,0-1.08-0.43T4.3,18.2V5.8q0-0.65 0.43-1.08T5.8,4.3H18.2q0.65,0 1.08,0.43T19.7,5.8V18.2q0,0.65-0.43,1.07T18.2,19.7H5.8Zm0-0.7H18.2q0.3,0 0.55-0.25T19,18.2V5.8q0-0.3-0.25-0.55T18.2,5H5.8Q5.5,5 5.25,5.25T5,5.8V18.2q0,0.3 0.25,0.55T5.8,19ZM5,19q0,0 0-0.25T5,18.2V5.8Q5,5.5 5,5.25T5,5Q5,5 5,5.25T5,5.8V18.2q0,0.3 0,0.55T5,19Zm3.7-2.65h6.8q0.23,0 0.33-0.2t-0.03-0.4L14,13.33q-0.13-0.15-0.3-0.15t-0.3,0.15l-2.2,2.73l-1.3-1.5q-0.13-0.13-0.29-0.13T9.33,14.58l-0.9,1.18q-0.15,0.2-0.05,0.4t0.33,0.2Z"/></svg>',
    audio: '<svg viewBox="0 0 24 24"><path d="M18.6,11.98q0-2.04-1.11-3.73T14.5,5.72q-0.15-0.07-0.22-0.2T14.27,5.27q0.08-0.14 0.26-0.17t0.35,0.05q2,0.95 3.21,2.77t1.21,4.05t-1.21,4.05T14.88,18.8q-0.17,0.07-0.35,0.05t-0.26-0.17q-0.07-0.13 0.01-0.26t0.22-0.2q1.87-0.84 2.99-2.52t1.11-3.73ZM7.95,13.7H5.45q-0.32,0-0.53-0.22T4.7,12.95v-1.9q0-0.32 0.22-0.53T5.45,10.3h2.5l2.5-2.5q0.17-0.18 0.41-0.08T11.1,8.05v7.9q0,0.24-0.24,0.33T10.45,16.2l-2.5-2.5ZM15.6,12q0,0.75-0.25,1.42t-0.72,1.19q-0.15,0.13-0.34,0.06T14.1,14.4V9.55q0-0.2 0.19-0.28t0.34,0.05q0.47,0.52 0.72,1.22T15.6,12ZM10.4,8.85L8.25,11H5.4v2H8.25l2.15,2.15V8.85ZM7.9,12Z"/></svg>',
    text: '<svg viewBox="0 0 24 24"><path d="M8.31,18.6Q8.2,18.5 8.2,18.35V6.02H3.68q-0.16,0-0.27-0.11T3.3,5.65T3.4,5.4T3.65,5.3h9.8q0.16,0 0.27,0.1t0.11,0.25t-0.1,0.26T13.48,6.02H8.93v12.3q0,0.16-0.1,0.27T8.57,18.7T8.31,18.6Zm8.84,0q-0.1-0.1-0.1-0.25V10.9H14.48q-0.16,0-0.27-0.11T14.1,10.53t0.1-0.25t0.25-0.1h5.88q0.16,0 0.27,0.1t0.11,0.25t-0.1,0.26T20.35,10.9h-2.6v7.45q0,0.15-0.1,0.25T17.4,18.7t-0.25-0.1Z"/></svg>',
    restart: '<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8,17.18V6.82Q8,6.4 8.3,6.11Q8.6,5.82 9,5.82q0.13,0 0.26,0.04T9.53,5.97l8.15,5.18q0.23,0.15 0.34,0.38q0.11,0.23 0.11,0.48t-0.11,0.47t-0.34,0.38L9.53,18.02Q9.4,18.1 9.26,18.14Q9.13,18.18 9,18.18q-0.4,0-0.7-0.29T8,17.18Z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M16,19q-0.82,0-1.41-0.59T14,17V7q0-0.82 0.59-1.41T16,5q0.82,0 1.41,0.59Q18,6.18 18,7V17q0,0.82-0.59,1.41T16,19ZM8,19q-0.82,0-1.41-0.59T6,17V7Q6,6.18 6.59,5.59T8,5Q8.83,5 9.41,5.59Q10,6.18 10,7V17q0,0.82-0.59,1.41Q8.83,19 8,19Z"/></svg>'
  };
  document.querySelectorAll('[data-icon]').forEach(n => n.outerHTML = ICON[n.dataset.icon]);

  /* ---------- state ---------- */
  const $ = s => document.querySelector(s);
  const world = $('#world'), sel = $('#sel'), ghost = $('#ghost'), bar = $('#bar'), dock = $('#dock'), menu = $('#menu');
  const toastEl = $('#toast'), fileAudio = $('#fileAudio'), fileImg = $('#fileImg');
  const DEF = {
    audio: { w: 200, h: 66, name: 'Audio Name', src: '', loop: false, trimStart: 0, trimEnd: 0, speed: 1, keepPitch: true },
    image: { w: 260, h: 190, src: '' },
    text:  { w: 280, h: 40, html: 'Text', font: 'Montserrat', fs: 32, color: '#111111', bold: false, italic: false }
  };
  const SAFE_SRC = /^data:(image|audio)\/[a-z0-9.+-]+;base64,/i;
  let items = [], els = {}, players = {}, selId = null, placing = null, editingId = null, pickFor = null, ro;
  const GRID = 40;                                   // keep in sync with --grid in the CSS
  const snap = v => Math.round(v / GRID) * GRID;
  const FONTS = [
    { n: 'Montserrat', fb: 'sans-serif' }, { n: 'Inter', fb: 'sans-serif' }, { n: 'Poppins', fb: 'sans-serif' },
    { n: 'Playfair Display', fb: 'serif' }, { n: 'Roboto Mono', fb: 'monospace' }, { n: 'Caveat', fb: 'cursive' },
    { n: 'Pacifico', fb: 'cursive' }, { n: 'Bebas Neue', fb: 'sans-serif' }, { n: 'Georgia', fb: 'serif' },
    { n: 'Arial', fb: 'sans-serif' }, { n: 'Courier New', fb: 'monospace' }
  ];
  const fam = n => { const f = FONTS.find(x => x.n === n); return "'" + n + "', " + (f ? f.fb : 'sans-serif'); };
  const uid = () => Math.random().toString(36).slice(2, 9);
  const get = id => items.find(i => i.id === id);

  let toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2200); }

  /* ---------- persistence ---------- */
  const serialize = () => JSON.stringify({ v: 1, items });
  function save() { try { localStorage.setItem('cueboard', serialize()); } catch (e) { /* too big or blocked: copy/paste still works */ } }

  const ALLOWED = new Set(['B', 'I', 'U', 'STRONG', 'EM', 'BR', 'DIV', 'SPAN', 'P']);
  function clean(html) {
    const t = document.createElement('template'); t.innerHTML = html;
    (function walk(n) {
      [...n.childNodes].forEach(c => {
        if (c.nodeType === 1) {
          walk(c);
          if (!ALLOWED.has(c.tagName)) c.replaceWith(...c.childNodes);
          else [...c.attributes].forEach(a => c.removeAttribute(a.name));
        } else if (c.nodeType !== 3) c.remove();
      });
    })(t.content);
    return t.innerHTML;
  }

  function normalize(raw) {
    if (!raw || !DEF[raw.type]) return null;
    const it = Object.assign({ id: uid(), x: 40, y: 280 }, DEF[raw.type], { type: raw.type });
    ['x', 'y', 'w', 'h', 'fs', 'trimStart', 'trimEnd', 'speed'].forEach(k => { if (typeof raw[k] === 'number' && isFinite(raw[k])) it[k] = raw[k]; });
    if (raw.type === 'audio') { it.name = String(raw.name || it.name).slice(0, 80); it.loop = !!raw.loop; it.custom = !!raw.custom; it.speed = Math.max(0.25, Math.min(4, it.speed || 1)); it.keepPitch = raw.keepPitch !== false; it.src = SAFE_SRC.test(raw.src) ? raw.src : ''; }
    if (raw.type === 'image') it.src = SAFE_SRC.test(raw.src) ? raw.src : '';
    if (raw.type === 'text') {
      it.html = clean(String(raw.html || '')); 
      if (typeof raw.font === 'string') it.font = raw.font.slice(0, 40);
      if (/^#[0-9a-f]{6}$/i.test(raw.color)) it.color = raw.color;
      it.bold = !!raw.bold; it.italic = !!raw.italic;
    }
    return it;
  }

  function loadItems(list) {
    Object.values(players).forEach(p => p.pause());
    players = {}; els = {}; world.innerHTML = ''; items = []; select(null);
    (list || []).map(normalize).filter(Boolean).forEach(it => { items.push(it); build(it); });
  }

  /* ---------- build elements ---------- */
  function position(it, el) { el.style.left = it.x + 'px'; el.style.top = it.y + 'px'; }

  function build(it) {
    const el = document.createElement('div');
    el.className = 'item ' + it.type; el.dataset.id = it.id;
    position(it, el);
    if (it.type === 'audio') buildAudio(it, el);
    if (it.type === 'image') buildImage(it, el);
    if (it.type === 'text') buildText(it, el);
    world.appendChild(el); els[it.id] = el;
    ro.observe(el);
    return el;
  }

  function buildAudio(it, el) {
    el.innerHTML = '<div class="row"><button class="restart" aria-label="Restart"></button><button class="play" aria-label="Play / stop"></button><div class="pill"><span class="name"></span><button class="kebab" aria-label="Options"><i></i><i></i><i></i></button></div></div><div class="seek"><div class="track"><div class="buf"></div><div class="fill"></div><div class="knob"></div></div></div>';
    el.querySelector('.restart').innerHTML = ICON.restart;
    el.querySelector('.play').innerHTML = ICON.play;
    el.querySelector('.restart').addEventListener('click', () => restartPlay(it));
    refreshName(it, el);
    el.querySelector('.play').addEventListener('click', () => togglePlay(it));
    el.querySelector('.name').addEventListener('dblclick', () => renameAudio(it));
    el.querySelector('.kebab').addEventListener('click', e => { e.stopPropagation(); openMenu(it); });
    const seek = el.querySelector('.seek'), track = el.querySelector('.track');
    let seeking = false;
    const seekTo = e => {
      const p = player(it); if (!p || !isFinite(p.duration) || !p.duration) return;
      const r = track.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const a = it.trimStart || 0, b = it.trimEnd || p.duration; p.currentTime = a + f * (b - a); updateSeek(it);
    };
    seek.addEventListener('pointerdown', e => { seeking = true; seek.setPointerCapture(e.pointerId); seekTo(e); });
    seek.addEventListener('pointermove', e => { if (seeking) seekTo(e); });
    seek.addEventListener('pointerup', () => { seeking = false; });
    seek.addEventListener('pointercancel', () => { seeking = false; });
  }

  function refreshName(it, el) {
    const n = (el || els[it.id]).querySelector('.name');
    n.textContent = it.src ? it.name : 'No files linked';
    n.classList.toggle('unlinked', !it.src);
  }

  function updateSeek(it) {
    const el = els[it.id]; if (!el) return;
    const track = el.querySelector('.track'), p = players[it.id];
    let f = 0, bf = 0;
    if (p && isFinite(p.duration) && p.duration) {
      const a = it.trimStart || 0, b = it.trimEnd || p.duration, len = Math.max(0.01, b - a);
      f = Math.max(0, Math.min(1, (p.currentTime - a) / len));
      if (p.buffered.length) bf = Math.max(0, Math.min(1, (p.buffered.end(p.buffered.length - 1) - a) / len));
    }
    track.style.setProperty('--p', f * 100 + '%'); track.style.setProperty('--b', bf * 100 + '%');
  }

  function player(it) {
    if (!it.src) return null;
    let p = players[it.id];
    if (!p || p._src !== it.src) {
      if (p) p.pause();
      p = new Audio(it.src); p._src = it.src; p.preload = 'auto';
      p.addEventListener('ended', () => { if (it.loop) { p.currentTime = it.trimStart || 0; p.play(); } else setPlayIcon(it.id, false); });
      p.addEventListener('pause', () => setPlayIcon(it.id, false));
      ['loadedmetadata', 'progress', 'seeked', 'pause', 'ended', 'timeupdate'].forEach(ev => p.addEventListener(ev, () => updateSeek(it)));
      p.addEventListener('play', () => { setPlayIcon(it.id, true); watch(it, p); });
      players[it.id] = p;
    }
    p.loop = false; p.playbackRate = it.speed || 1;
    p.preservesPitch = p.mozPreservesPitch = p.webkitPreservesPitch = it.keepPitch !== false;
    return p;
  }
  function watch(it, p) {
    cancelAnimationFrame(p._raf);
    const tick = () => {
      updateSeek(it);
      if (p.paused) return;
      if (it.trimEnd && p.currentTime >= it.trimEnd) {
        if (it.loop) p.currentTime = it.trimStart || 0;
        else { p.pause(); p.currentTime = it.trimStart || 0; return; }
      }
      p._raf = requestAnimationFrame(tick);
    };
    p._raf = requestAnimationFrame(tick);
  }
  function setPlayIcon(id, playing) { const b = els[id] && els[id].querySelector('.play'); if (b) { b.innerHTML = playing ? ICON.pause : ICON.play; b.classList.toggle('is-playing', playing); } }
  function togglePlay(it) {
    const p = player(it);
    if (!p) { pickFor = it.id; fileAudio.click(); return; }
    if (p.paused) {
      const a = it.trimStart || 0, end = it.trimEnd || p.duration || 0;
      if (p.ended || p.currentTime < a || (end && p.currentTime >= end - 0.03)) p.currentTime = a;   // finished -> start over, otherwise resume
      p.play().catch(() => toast('Could not play this file'));
    } else p.pause();                                  // pause keeps its place
  }

  function restartPlay(it) {
    const p = player(it);
    if (!p) { pickFor = it.id; fileAudio.click(); return; }
    p.pause(); p.currentTime = it.trimStart || 0; updateSeek(it);   // rewind and stay stopped
  }

  function buildImage(it, el) {
    el.style.width = it.w + 'px'; el.style.height = it.h + 'px';
    renderImage(it, el);
  }
  function renderImage(it, el) {
    el.innerHTML = '';
    if (it.src) { const img = new Image(); img.src = it.src; img.draggable = false; el.appendChild(img); }
    else { const d = document.createElement('div'); d.className = 'empty'; d.innerHTML = ICON.image + '<span>Click to upload</span>'; el.appendChild(d); }
  }

  function buildText(it, el) {
    el.style.width = it.w + 'px';
    const c = document.createElement('div'); c.className = 'content'; c.innerHTML = it.html;
    el.appendChild(c); styleText(it, el);
    c.addEventListener('blur', () => { it.html = clean(c.innerHTML) || 'Text'; c.contentEditable = 'false'; editingId = null; save(); });
    c.addEventListener('input', () => { syncSel(); });
    c.addEventListener('keydown', e => { if (e.key === 'Escape') c.blur(); e.stopPropagation(); });
    el.addEventListener('dblclick', () => startEdit(it.id));
  }
  function styleText(it, el) {
    const c = el.querySelector('.content');
    c.style.fontFamily = fam(it.font); c.style.fontSize = it.fs + 'px'; c.style.color = it.color;
    c.style.fontWeight = it.bold ? 700 : 400; c.style.fontStyle = it.italic ? 'italic' : 'normal';
    el.style.width = it.w + 'px';
  }
  function startEdit(id, selectAll) {
    const el = els[id]; if (!el) return;
    const c = el.querySelector('.content'); editingId = id; select(id);
    c.contentEditable = 'true'; c.focus();
    const r = document.createRange(); r.selectNodeContents(c); if (!selectAll) r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  /* ---------- selection ---------- */
  function select(id) {
    if (editingId && editingId !== id) { const c = els[editingId] && els[editingId].querySelector('.content'); if (c) c.blur(); }
    selId = id; closeMenu(); closePops();

    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
    let top = r.bottom + 10; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 10);
    pop.style.top = top + 'px';
  }
  function closePops() { fmenu.classList.remove('show'); picker.classList.remove('show'); fbtn.classList.remove('open'); }
  fbtn.addEventListener('mousedown', e => e.preventDefault());
  fbtn.addEventListener('click', () => {
    const open = fmenu.classList.contains('show'); closePops(); if (open) return;
    placePop(fmenu, fbtn); fmenu.classList.add('show'); fbtn.classList.add('open'); syncThumb();
    const on = fmenu.querySelector('.on'); if (on) { flist.style.scrollBehavior = 'auto'; flist.scrollTop = Math.max(0, on.offsetTop - 80); flist.style.scrollBehavior = ''; syncThumb(); }
  });
  addEventListener('pointerdown', e => { if (!e.target.closest('.pop, .fbtn, .swatch')) closePops(); });

  /* colour wheel + picker */
  const wheel = $('#wheel'), hueH = $('#hueH'), svH = $('#svH'), hexIn = $('#hex'), cr = $('#cr'), cg = $('#cg'), cb = $('#cb');
  let H = 0, S = 0, V = 0, pk = null;
  const hsv2rgb = (h, s, v) => { const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5), f(3), f(1)].map(x => Math.round(x * 255)); };
  const rgb2hsv = (r, g, b) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
    if (d) { if (mx === r) h = ((g - b) / d + 6) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; } return [h, mx ? d / mx : 0, mx]; };
  const toHex = (r, g, b) => '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
  const fromHex = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h.trim()); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };

  function pickerRender(skip) {
    const [r, g, b] = hsv2rgb(H, S, V), h = toHex(r, g, b), a = H * Math.PI / 180;
    picker.style.setProperty('--hue', 'hsl(' + H + ' 100% 50%)'); picker.style.setProperty('--c', h);
    hueH.style.left = 110 + 100 * Math.sin(a) + 'px'; hueH.style.top = 110 - 100 * Math.cos(a) + 'px';
    svH.style.left = 50 + S * 120 + 'px'; svH.style.top = 50 + (1 - V) * 120 + 'px';
    if (skip !== 'hex') hexIn.value = h;
    if (skip !== 'rgb') { cr.value = r; cg.value = g; cb.value = b; }
    return h;
  }
  function commitColor(skip, live) {
    const h = pickerRender(skip), it = get(selId); if (!it || it.type !== 'text') return;
    it.color = h; const c = els[it.id].querySelector('.content');
    if (live) c.style.transition = 'opacity .14s ease';      // no lag while dragging
    c.style.color = h; cbtn.style.setProperty('--c', h); save();
  }
  function setRGB(rgb, skip) { [H, S, V] = rgb2hsv(...rgb); commitColor(skip, false); }
  const wp = e => { const r = wheel.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function wheelMove(e) {
    const [x, y] = wp(e);
    if (pk === 'hue') H = (Math.atan2(x - 110, -(y - 110)) * 180 / Math.PI + 360) % 360;
    else { S = Math.max(0, Math.min(1, (x - 50) / 120)); V = 1 - Math.max(0, Math.min(1, (y - 50) / 120)); }
    commitColor(null, true);
  }
  wheel.addEventListener('pointerdown', e => { const [x, y] = wp(e); pk = Math.hypot(x - 110, y - 110) >= 90 ? 'hue' : 'sv'; wheel.setPointerCapture(e.pointerId); wheelMove(e); });
  wheel.addEventListener('pointermove', e => { if (pk) wheelMove(e); });
  const endPk = () => { if (!pk) return; pk = null; const it = get(selId); if (it && els[it.id]) els[it.id].querySelector('.content').style.transition = ''; };
  wheel.addEventListener('pointerup', endPk); wheel.addEventListener('pointercancel', endPk);
  hexIn.addEventListener('input', () => { const rgb = fromHex(hexIn.value); if (rgb) setRGB(rgb, 'hex'); });
  [cr, cg, cb].forEach(inp => inp.addEventListener('input', () => {
    const v = [cr, cg, cb].map(x => Math.max(0, Math.min(255, Math.round(+x.value || 0)))); setRGB(v, 'rgb');
  }));
  ['#111111', '#ffffff', '#e5484d', '#f76b15', '#f5d90a', '#30a46c', '#0091ff', '#8e4ec6', '#e93d82'].forEach(col => {
    const b = document.createElement('button'); b.style.background = col; b.title = col;
    b.addEventListener('click', () => setRGB(fromHex(col)));
    $('#swatches').appendChild(b);
  });
  if (window.EyeDropper) $('#eye').addEventListener('click', () => new EyeDropper().open().then(r => { const rgb = fromHex(r.sRGBHex); if (rgb) setRGB(rgb); }).catch(() => {}));
  else $('#eye').style.display = 'none';
  cbtn.addEventListener('mousedown', e => e.preventDefault());
  cbtn.addEventListener('click', () => {
    const open = picker.classList.contains('show'); closePops(); if (open) return;
    const it = get(selId); if (!it || it.type !== 'text') return;
    [H, S, V] = rgb2hsv(...fromHex(it.color)); pickerRender();
    placePop(picker, cbtn); picker.classList.add('show');
  });

  /* ---------- keyboard ---------- */
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (placing) stopPlacing(); else if (dock.classList.contains('open')) closeDock(); else if (!editingId) select(null); closeMenu(); $('#overlay').classList.remove('show'); if (lenOverlay.classList.contains('show')) closeLength(); if (spdOverlay.classList.contains('show')) closeSpeed(); }
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || editingId || document.activeElement.isContentEditable;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selId && !typing) { e.preventDefault(); removeItem(selId); }
  });

  /* ---------- copy / paste save ---------- */
  $('#copy').addEventListener('click', async () => {
    const text = serialize();
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    toast('Save copied to clipboard (' + (text.length > 1e6 ? (text.length / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(text.length / 1e3)) + ' KB') + ')');
  });
  const overlay = $('#overlay'), pasteBox = $('#pasteBox');
  $('#paste').addEventListener('click', () => { pasteBox.value = ''; overlay.classList.add('show'); setTimeout(() => pasteBox.focus(), 50); });
  $('#pasteCancel').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('pointerdown', e => { if (e.target === overlay) overlay.classList.remove('show'); });
  $('#pasteGo').addEventListener('click', () => {
    try {
      const data = JSON.parse(pasteBox.value.trim());
      if (!data || !Array.isArray(data.items)) throw 0;
      loadItems(data.items); save(); overlay.classList.remove('show'); toast('Loaded ' + items.length + ' element' + (items.length === 1 ? '' : 's'));
    } catch (e) { toast('That doesn’t look like a valid save'); }
  });

  /* ---------- boot ---------- */
  try { const s = JSON.parse(localStorage.getItem('cueboard')); if (s && Array.isArray(s.items)) loadItems(s.items); } catch (e) {}
})();
</script>
</body>
</html>
